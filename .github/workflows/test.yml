name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: ghcr.io/zaplang-io/zap:latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute codec and TCP tests
        run: sh tools/run-tests.sh

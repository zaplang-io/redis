name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  codec:
    name: Offline codec and connection tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: ghcr.io/zaplang-io/zap@sha256:7cf901e2a8d465be3c480474238764411f77308c925cd3df26ef46b240f4e5c4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Execute offline tests
        run: sh tools/run-tests.sh
      - name: Execute verified TLS transport tests
        run: sh tools/run-tls-tests.sh
      - name: Verify reference-local relocation in the pinned runtime
        run: timeout -k 5s 60s zap run tools/audit/immix-local-slot-probe.zap
  integration:
    name: Live Redis ${{ matrix.server.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        server:
          - version: 7.4.12
            image: redis:7.4.12@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
          - version: 8.10.3
            image: redis:8.10.3@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
    container: ghcr.io/zaplang-io/zap@sha256:7cf901e2a8d465be3c480474238764411f77308c925cd3df26ef46b240f4e5c4
    services:
      redis:
        image: ${{ matrix.server.image }}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      REDIS_TEST_URL: redis://redis:6379/0
      REDIS_TEST_SERVER_VERSION: ${{ matrix.server.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Execute live basic and isolated session tests
        run: sh tools/run-integration-tests.sh --isolated
      - name: Execute installed-package examples
        env:
          REDIS_EXAMPLE_URL: redis://redis:6379/0
        run: sh tools/run-package-tests.sh --live
  package:
    name: Package consumers and examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: ghcr.io/zaplang-io/zap@sha256:7cf901e2a8d465be3c480474238764411f77308c925cd3df26ef46b240f4e5c4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Validate release candidate metadata
        run: sh tools/check-release.sh
      - name: Install path and registry consumers; check examples
        run: sh tools/run-package-tests.sh
